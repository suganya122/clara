name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # arm64 macOS runners were not available (capacity), so use the Intel pool.
    # Switch back to a macOS 26 runner at Milestone 7 (SpeechAnalyzer needs the 26 SDK).
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
