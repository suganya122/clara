name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-26 stayed queued for 10+ minutes on a free repo, so use macos-latest.
    # Switch back to a macOS 26 runner at Milestone 7 (SpeechAnalyzer needs the 26 SDK).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
